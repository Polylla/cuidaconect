<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CuidaConect — Prototipo Navegable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--primary:#1565A6;--primary-light:#3E88C4;--accent:#2E9E6B;--bg:#F4F9F8;--surface:#FFFFFF;--text:#1C2B33;--text-secondary:#5A6E76;--success:#2E9E6B;--warning:#D98C2B;--error:#C25450;--border:#DCE6EA;}
*{box-sizing:border-box;}
body{margin:0;background:#EAEFEF;color:var(--text);font-family:'Inter',sans-serif;}
.phone{width:320px;border-radius:38px;background:#101820;padding:10px;box-shadow:0 20px 44px rgba(16,24,32,.22);}
.phone-screen{background:var(--bg);border-radius:30px;overflow:hidden;height:640px;display:flex;flex-direction:column;position:relative;}
.screen-body{flex:1;overflow-y:auto;padding:22px 18px 18px;}
.screen-body::-webkit-scrollbar{display:none;}
.statusbar{height:26px;}
.t-display{font-family:'Fraunces',serif;font-weight:600;font-size:26px;line-height:1.2;}
.t-h1{font-weight:700;font-size:21px;margin:0 0 4px;}
.t-h2{font-weight:600;font-size:17px;margin:0 0 4px;}
.t-body{font-size:15px;line-height:1.5;}
.t-sec{font-size:13px;color:var(--text-secondary);}
.t-data{font-family:'IBM Plex Mono',monospace;font-size:13.5px;}
.btn{font-family:'Inter';font-weight:600;font-size:14.5px;padding:13px 20px;border-radius:13px;border:none;cursor:pointer;width:100%;text-align:center;display:block;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
.btn-ghost{background:transparent;color:var(--text-secondary);text-decoration:underline;padding:8px;}
.btn + .btn{margin-top:10px;}
.role-card{border:1.5px solid var(--border);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;margin-bottom:12px;cursor:pointer;background:#fff;}
.role-emoji{font-size:26px;width:42px;height:42px;background:#E5F1F8;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;}
.field input{width:100%;font-family:'IBM Plex Mono',monospace;font-size:14px;padding:11px 12px;border-radius:11px;border:1.5px solid var(--border);background:#fff;outline:none;}
.upload-row{display:flex;align-items:center;justify-content:space-between;border:1.5px dashed var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px;background:#fff;}
.chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;}
.chip-ok{background:#E1F3EA;color:var(--success);}
.chip-pending{background:#FBEEDC;color:var(--warning);}
.otp-row{display:flex;gap:8px;margin:18px 0;}
.otp-box{width:42px;height:52px;border:1.5px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:20px;background:#fff;}
.otp-box.filled{border-color:var(--primary);color:var(--primary);font-weight:700;}
.match-card{border-radius:20px;background:#fff;box-shadow:0 6px 18px rgba(28,43,51,.08);overflow:hidden;}
.match-photo{height:190px;background:linear-gradient(135deg,#DCEAF2,#D3EFE2);display:flex;align-items:center;justify-content:center;position:relative;font-family:'Fraunces',serif;font-size:38px;color:var(--primary);font-weight:600;}
.ring{width:60px;height:60px;border-radius:50%;position:absolute;bottom:-26px;left:16px;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-avatar{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:var(--primary);font-size:15px;}
.match-info{padding:36px 16px 14px;}
.match-tags{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 4px;}
.tag{background:#E5F1F8;color:var(--primary);font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:100px;}
.match-actions{display:flex;justify-content:center;gap:20px;padding:14px 0 18px;}
.round-btn{width:50px;height:50px;border-radius:50%;border:none;font-size:19px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.10);}
.round-btn.reject{background:#fff;color:var(--error);border:1.5px solid var(--border);}
.round-btn.accept{background:var(--success);color:#fff;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:5px 10px;border-radius:100px;margin:0 6px 6px 0;}
.badge-ok{background:#E1F3EA;color:var(--success);}
.badge-pending{background:#FBEEDC;color:var(--warning);}
.badge-health{background:#DDEBF6;color:var(--primary);}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.list-row:last-child{border-bottom:none;}
.avatar-sm{width:42px;height:42px;border-radius:50%;background:#DCEAF2;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;color:var(--primary);font-weight:600;font-size:14px;flex-shrink:0;}
.list-title{font-size:14px;font-weight:600;margin:0;}
.list-sub{font-size:12.5px;color:var(--text-secondary);margin:2px 0 0;}
.bubble{max-width:78%;padding:10px 13px;border-radius:16px;font-size:13.5px;margin-bottom:8px;line-height:1.4;}
.bubble-them{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;}
.bubble-me{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:4px;}
.chat-composer{display:flex;gap:8px;align-items:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--border);flex-shrink:0;}
.chat-composer input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:22px;padding:11px 14px;font:14px Inter,sans-serif;outline:none;background:#F8FBFB;}
.chat-composer input:focus{border-color:var(--primary-light);}
.chat-composer button{border:0;border-radius:22px;background:var(--primary);color:#fff;font:600 13px Inter,sans-serif;padding:11px 15px;cursor:pointer;}

.agenda-card{border:1.5px solid var(--border);border-radius:14px;padding:14px;background:#fff;margin-bottom:10px;}
.agenda-date{background:#E5F1F8;color:var(--primary);font-weight:700;font-size:11px;padding:4px 9px;border-radius:100px;display:inline-block;margin-bottom:8px;}
.course-card{border:1.5px solid var(--border);border-radius:14px;padding:13px;background:#fff;margin-bottom:10px;display:flex;gap:12px;align-items:center;}
.course-icon{width:40px;height:40px;border-radius:10px;background:#E1F3EA;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.progress-bar{height:6px;background:var(--border);border-radius:6px;margin-top:6px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);}
.stars{font-size:26px;color:#E3E9EB;letter-spacing:4px;margin:14px 0;}
.stars span{color:var(--warning);}
.screen-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.back-btn{width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex-shrink:0;}
.bottom-nav{display:flex;justify-content:space-around;padding:10px 4px 12px;background:#fff;border-top:1px solid var(--border);}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;background:none;border:none;}
.nav-item.active{color:var(--primary);}
.nav-icon{font-size:17px;}
.top-app-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;}
.icon-btn{width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;}
.menu-overlay{position:absolute;inset:0;background:rgba(16,24,32,.35);display:flex;align-items:flex-end;z-index:10;}
.menu-sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px;}
.menu-item{display:flex;align-items:center;gap:12px;padding:12px 4px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);cursor:pointer;}
.menu-item:last-child{border-bottom:none;color:var(--error);}
.empty-state{text-align:center;padding:60px 10px;}
.empty-emoji{font-size:44px;margin-bottom:12px;}

  /* ---- Top bar ---- */
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  .topbar h1{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:0;color:var(--primary);}
  .topbar p{margin:2px 0 0;font-size:12.5px;color:var(--text-secondary);}
  .reset-btn{font-family:'Inter';font-weight:600;font-size:13px;color:var(--primary);background:#E5F1F8;border:none;padding:9px 16px;border-radius:100px;cursor:pointer;}
  /* ---- Layout ---- */
  .stage{display:flex;justify-content:center;padding:44px 20px 0;}
  .role-card:hover{border-color:var(--primary-light);}
  .field input:focus{border-color:var(--primary-light);}
  /* thumbnail rail */
  .rail-wrap{margin-top:56px;padding:28px 24px 60px;background:var(--surface);border-top:1px solid var(--border);}
  .rail-group{max-width:1180px;margin:0 auto 26px;}
  .rail-group h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--primary);font-weight:700;margin:0 0 12px;}
  .rail-items{display:flex;flex-wrap:wrap;gap:10px;}
  .rail-item{font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:100px;background:#F4F9F8;border:1.5px solid var(--border);cursor:pointer;color:var(--text);}
  .rail-item.current{background:var(--primary);color:#fff;border-color:var(--primary);}

/* Matching diferenciado y tarjetas con interacción tipo swipe */
.matching-intro{margin:4px 0 14px}.matching-counter{display:flex;justify-content:space-between;align-items:center;margin:10px 0;color:var(--text-secondary);font-size:12px}.matching-progress{height:5px;background:var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px}.matching-progress span{display:block;height:100%;background:var(--accent);transition:width .2s}.matching-card{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(28,43,51,.08);touch-action:pan-y;user-select:none;transition:transform .16s,opacity .16s}.matching-card.swipe-left{transform:translateX(-90px) rotate(-8deg);opacity:.35}.matching-card.swipe-right{transform:translateX(90px) rotate(8deg);opacity:.35}.matching-visual{height:145px;background:linear-gradient(135deg,#DCEAF2,#D3EFE2);display:flex;align-items:center;justify-content:center}.matching-initials{width:82px;height:82px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--primary);font:600 26px 'Fraunces',serif;border:4px solid rgba(255,255,255,.7)}.matching-details{padding:15px 16px 12px}.matching-meta{font-size:12px;color:var(--text-secondary);line-height:1.5;margin-top:5px}.matching-label{display:inline-block;background:#E5F1F8;color:var(--primary);border-radius:100px;padding:4px 9px;font-size:10.5px;font-weight:700;margin:3px 3px 0 0}.matching-actions{display:flex;align-items:center;justify-content:center;gap:25px;padding:14px 0 4px}.matching-actions .round-btn{width:54px;height:54px;font-size:22px}.matching-hint{text-align:center;font-size:11px;color:var(--text-secondary);margin:9px 0 2px}.matching-empty{text-align:center;padding:38px 12px}


/* Pantalla transitoria de búsqueda simulada (solo al completar MFA). */
.match-search-wait{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 20px;gap:13px;box-sizing:border-box}
.match-search-icon{position:relative;width:108px;height:108px;display:flex;align-items:center;justify-content:center;background:#e1f3ea;border-radius:50%;font-size:58px;animation:match-search-pulse 1.2s ease-in-out infinite alternate}
.match-search-lens{position:absolute;right:-6px;bottom:-3px;font-size:36px;filter:drop-shadow(0 2px 2px #fff)}
.match-search-dots{display:flex;gap:7px;margin-top:5px}
.match-search-dots span{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:match-search-bounce .9s ease-in-out infinite alternate}
.match-search-dots span:nth-child(2){animation-delay:.18s}.match-search-dots span:nth-child(3){animation-delay:.36s}
@keyframes match-search-pulse{from{transform:scale(.96)}to{transform:scale(1.05)}}
@keyframes match-search-bounce{from{opacity:.35;transform:translateY(0)}to{opacity:1;transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.match-search-icon,.match-search-dots span{animation:none}}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>CuidaConect — Prototipo</h1>
    <p id="crumb">Pantalla actual: Selección de perfil</p>
  </div>
  <button class="reset-btn" onclick="currentRole='family';matchingIndex=0;goto('role-select')">⟲ Reiniciar flujo</button>
</div>

<div class="stage">
  <div class="phone">
    <div class="phone-screen" id="phoneScreen"></div>
  </div>
</div>

<div class="rail-wrap">
  <div class="rail-group"><h3>Módulo 1 — Registro e inicio de sesión</h3><div class="rail-items" id="rail-1"></div></div>
  <div class="rail-group"><h3>Módulo 2 — Matching</h3><div class="rail-items" id="rail-2"></div></div>
  <div class="rail-group"><h3>Módulo 3 — Perfiles</h3><div class="rail-items" id="rail-3"></div></div>
  <div class="rail-group"><h3>Módulo 4 — Navegación, chat, agenda y cierre</h3><div class="rail-items" id="rail-4"></div></div>
</div>

<script>
const ring = (pct, size=60) => {
  const r = (size/2)-6, c = 2*Math.PI*r, off = c - (c*pct/100);
  return `<div class="ring" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#DCE6EA" stroke-width="5"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#2E9E6B" stroke-width="5" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    </svg>
    <div class="ring-avatar" style="width:${size-14}px;height:${size-14}px;">VT</div>
  </div>`;
};
const bottomNav = (active) => `
  <div class="bottom-nav">
    <button class="nav-item ${active==='matching-feed'?'active':''}" onclick="goto('matching-feed')"><span class="nav-icon">♡</span>Matching</button>
    <button class="nav-item ${active==='agenda'?'active':''}" onclick="goto('agenda')"><span class="nav-icon">📅</span>Agenda</button>
    <button class="nav-item ${active==='training'?'active':''}" onclick="goto('training')"><span class="nav-icon">🎓</span>Formación</button>
    <button class="nav-item ${active==='chat-list'?'active':''}" onclick="goto('chat-list')"><span class="nav-icon">💬</span>Chats</button>
  </div>`;
const topAppBar = (screenId) => `
  <div class="top-app-bar">
    <span class="t-h2" style="font-family:'Fraunces',serif;color:var(--primary);">CuidaConect</span>
    <div class="icon-btn" onclick="openMenu('${screenId}')">☰</div>
  </div>`;

let currentRole = 'family'; // family: demandante; caregiver: oferente
let matchingIndex = 0;
let swipeStartX = null;
const matchingProfiles = {
 family:[
  {name:'Valeria Tapia',initials:'VT',subtitle:'TENS · 5 años de experiencia',distance:'A 1,2 km',rate:'$5.000 CLP / hora',tags:['Primeros auxilios','Movilización','Turnos diurnos'],about:'Experiencia en acompañamiento y apoyo en actividades de la vida diaria. Disponibilidad de lunes a viernes.'},
  {name:'Camila Rojas',initials:'CR',subtitle:'Cuidadora con experiencia',distance:'A 2,4 km',rate:'$4.500 CLP / hora',tags:['Acompañamiento','Alimentación','Compañía'],about:'Experiencia en cuidado domiciliario y acompañamiento de personas mayores.'},
  {name:'Daniela Muñoz',initials:'DM',subtitle:'Técnico en enfermería',distance:'A 3,1 km',rate:'$5.500 CLP / hora',tags:['Apoyo cotidiano','Movilización','Turnos flexibles'],about:'Formación técnica y experiencia en apoyo cotidiano a personas mayores.'},
  {name:'Paula Herrera',initials:'PH',subtitle:'Cuidadora con formación',distance:'A 3,8 km',rate:'$4.800 CLP / hora',tags:['Estimulación cognitiva','Acompañamiento','Turno diurno'],about:'Experiencia en acompañamiento, actividades recreativas y apoyo en rutinas diarias.'},
  {name:'Fernanda Soto',initials:'FS',subtitle:'Estudiante del área de salud',distance:'A 4,5 km',rate:'$4.000 CLP / hora',tags:['Acompañamiento','Apoyo cotidiano','Media jornada'],about:'Experiencia de apoyo familiar y disponibilidad para turnos de media jornada.'}
 ],
 caregiver:[
  {name:'Ignacio Cortés',initials:'IC',contactName:'Cecilia Cortés',contactRelation:'Hija',subtitle:'86 años · Peñalolén',location:'Peñalolén',needs:'Acompañamiento diario y apoyo para movilizarse dentro del hogar.',schedule:'Lunes a viernes, 8:00–18:00',distance:'A 1,2 km',rate:'Turno diurno · 8:00–18:00',tags:['Acompañamiento','Actividades diarias','Movilidad reducida'],about:'Ignacio requiere compañía y apoyo para desplazarse de forma asistida dentro de su domicilio.'},
  {name:'Elena Muñoz',initials:'EM',contactName:'Javier Muñoz',contactRelation:'Hijo',subtitle:'79 años · Ñuñoa',location:'Ñuñoa',needs:'Compañía, preparación de alimentos y acompañamiento en paseos breves.',schedule:'Lunes a viernes, 8:00–13:00',distance:'A 2,4 km',rate:'Media jornada · Mañana',tags:['Compañía','Preparación de alimentos','Paseos'],about:'Elena necesita compañía durante las mañanas, apoyo para preparar alimentos y acompañamiento en paseos.'},
  {name:'Rosa González',initials:'RG',contactName:'Andrea González',contactRelation:'Hija',subtitle:'83 años · Macul',location:'Macul',needs:'Apoyo para movilización asistida y actividades cotidianas en el hogar.',schedule:'Lunes, miércoles y viernes, 9:00–17:00',distance:'A 3,1 km',rate:'Tres días a la semana · 9:00–17:00',tags:['Apoyo cotidiano','Movilización asistida','Acompañamiento'],about:'Rosa requiere apoyo para movilizarse de manera asistida y realizar actividades cotidianas en su domicilio.'},
  {name:'Arturo Pérez',initials:'AP',contactName:'Marcela Pérez',contactRelation:'Hija',subtitle:'75 años · La Reina',location:'La Reina',needs:'Acompañamiento y apoyo con alimentación y organización de rutinas.',schedule:'Lunes a viernes, 14:00–18:00',distance:'A 3,8 km',rate:'Turno parcial · Tarde',tags:['Acompañamiento','Alimentación','Rutinas'],about:'Arturo busca acompañamiento por las tardes y apoyo para mantener sus rutinas y horarios de alimentación.'},
  {name:'Marta Silva',initials:'MS',contactName:'Patricia Silva',contactRelation:'Hija',subtitle:'88 años · Peñalolén',location:'Peñalolén',needs:'Compañía, apoyo en el hogar y ayuda en actividades diarias.',schedule:'Martes a sábado, 10:00–16:00',distance:'A 4,5 km',rate:'Martes a sábado · 10:00–16:00',tags:['Compañía','Apoyo en el hogar','Actividades diarias'],about:'Marta necesita compañía y apoyo general en el hogar durante seis horas al día.'}
 ]
};
function selectRole(role){currentRole=role;matchingIndex=0;goto(role==='family'?'register-family':'register-caregiver');}

// Conversaciones ficticias diferenciadas. Los mensajes y las vistas previas
// comparten una misma fuente de datos para evitar que se contradigan.
let activeChatIndex = 0;
let activeChatMode = 'list';
let activeMatchedChatMessages = [];
const chatExamples = [
 {familyName:'Cecilia Cortés', senior:'Ignacio Cortés', caregiver:'Valeria Tapia', time:'14:02',
  messages:[['them','Hola, soy Cecilia, hija de Ignacio. Estamos buscando apoyo durante las mañanas.'],['me','¡Hola Cecilia! Gracias por contactarme. ¿Qué tareas necesitan cubrir?'],['them','Principalmente acompañamiento y apoyo para movilizarse dentro de casa.'],['me','Perfecto. Podemos conversar sobre los horarios disponibles.'],['them','¿Podrías venir el jueves por la mañana?']]},
 {familyName:'Marisol Jara', senior:'Elena Muñoz', caregiver:'Camila Rojas', time:'Ayer',
  messages:[['them','Hola, necesito coordinar acompañamiento para mi mamá Elena.'],['me','Claro, ¿sería para los días de semana?'],['them','Sí, idealmente de lunes a viernes durante la mañana.'],['me','Tengo disponibilidad en ese horario. ¡Lo podemos coordinar!'],['them','Muchas gracias, quedamos atentas.']]},
 {familyName:'Roberto Pinto', senior:'Rosa González', caregiver:'Daniela Muñoz', time:'Lun',
  messages:[['them','Buenas tardes. Mi tía Rosa necesita apoyo para movilizarse y realizar algunas actividades en casa.'],['me','Buenas tardes, Roberto. ¿Qué días requieren el servicio?'],['them','Principalmente lunes, miércoles y viernes.'],['me','Gracias por la información. Revisemos los horarios y detalles.'],['them','¿Tienes disponibilidad el sábado?']]},
 {familyName:'Patricia Silva', senior:'Marta Silva', caregiver:'Paula Herrera', time:'Mar',
  messages:[['them','Hola, estoy consultando por acompañamiento para mi mamá Marta.'],['me','¡Hola! Cuéntame qué tipo de apoyo necesita.'],['them','Compañía y ayuda en algunas actividades del hogar por las tardes.'],['me','Entendido. Podemos revisar si los horarios nos acomodan a ambas.'],['them','Te envío los horarios que conversamos.']]}
];
// La conversación se adapta al rol: "me" siempre representa al usuario actual.
let chatSessions = {};
function escapeChatText(value){
 return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function getChatMessages(index){
 const key=currentRole+':'+index;
 if(!chatSessions[key]){
   const source=chatExamples[index].messages;
   chatSessions[key]=source.map(([who,msg])=>[currentRole==='family'?(who==='me'?'them':'me'):who,msg]);
 }
 return chatSessions[key];
}
function chatDisplayData(){
 const isFamily=currentRole==='family';
 return chatExamples.map((c,i)=>{
   const person=isFamily?c.caregiver:c.familyName;
   const messages=getChatMessages(i);
   const lastMessage=messages[messages.length-1]?.[1]||'Sin mensajes todavía';
   return {name:person,context:c.senior,preview:lastMessage,time:c.time,messages};
 });
}

function accountHolderName(){return currentRole==='family'?(createdFamilyProfile.registerType==='relative'&&createdFamilyProfile.contactName?createdFamilyProfile.contactName:createdFamilyProfile.name):createdCaregiverProfile.name;}
function renderChatList(){
 const data=chatDisplayData();
 const matchedRows=Object.entries(chatSessions).filter(([key])=>key.startsWith('matched:'+currentRole+':')).map(([key,messages])=>{
  const idx=Number(key.split(':')[2]);
  const p=matchingProfiles[currentRole][idx];if(!p)return '';
  const senior=currentRole==='family'?createdFamilyProfile.name:p.name;
  const contact=currentRole==='family'?p.name:getFamilyContact(p).name;
  const preview=messages[messages.length-1]?.[1]||'Conversación iniciada';
  const initials=contact.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
  return `<div class="list-row" onclick="openMatchedChatAt(${idx})"><div class="avatar-sm">${escapeChatText(initials)}</div><div style="flex:1;min-width:0;"><p class="list-title">${escapeChatText(contact)}</p><p class="list-sub">${escapeChatText(senior)} · ${escapeChatText(preview)}</p></div></div>`;
 }).join('');
 const rows=data.map((c,i)=>{
   const initials=c.name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
   return `<div class="list-row" onclick="openChat(${i})"><div class="avatar-sm">${escapeChatText(initials)}</div><div style="flex:1;min-width:0;"><p class="list-title">${escapeChatText(c.name)}</p><p class="list-sub">${escapeChatText(c.context)} · ${escapeChatText(c.preview)}</p></div><span class="t-sec">${escapeChatText(c.time)}</span></div>`;
 }).join('');
 const phone=document.getElementById('phoneScreen');
 phone.innerHTML=`<div class="statusbar"></div>${topAppBar('chat-list')}<div class="screen-body"><div class="t-h1">Chats</div><p class="t-sec" style="margin-bottom:12px;">Conversaciones de demostración vinculadas a perfiles de CuidaConect.</p>${matchedRows}${rows}</div>${bottomNav('chat-list')}`;
 document.getElementById('crumb').textContent='Pantalla actual: Lista de chats';
 document.querySelectorAll('.rail-item').forEach(b=>b.classList.toggle('current',b.dataset.id==='chat-list'));
}

function openMatchedChatAt(index){if(currentRole==='family')selectedCaregiverIndex=index;else selectedFamilyIndex=index;openMatchedChat();}
function openChat(index){activeChatMode='list';activeChatIndex=index;renderChatConversation();}
function openMatchedChat(){
 activeChatMode='matched';
 const isFamily=currentRole==='family';
 const profile=getMatchedProfile();
 const seniorName=isFamily?(createdFamilyProfile.name||'la persona mayor'):(profile.name||'la persona mayor');
 const caregiverName=isFamily?profile.name:(createdCaregiverProfile.name||'Cuidador/a');
 const contact=isFamily?null:getFamilyContact(profile);
 const contactName=isFamily?caregiverName:contact.name;
 const contactRelation=isFamily?'Cuidador/a':contact.relation;
 const key=`matched:${currentRole}:${isFamily?selectedCaregiverIndex:selectedFamilyIndex}`;
 if(!chatSessions[key]){
   if(isFamily){
     chatSessions[key]=[
       ['them',`Hola, soy ${caregiverName}. Gracias por revisar mi perfil. ¿Qué apoyo necesita ${seniorName} en relación con ${createdFamilyProfile.needs||'sus actividades cotidianas'}?`],
       ['me',`Hola, soy ${accountHolderName()}. ${accountHolderName()===seniorName?'Necesito apoyo en mis actividades diarias.':`Estoy coordinando apoyo para ${seniorName}.`} Me gustaría revisar días y horarios.`],
       ['them',`Claro. Podemos revisar la disponibilidad y acordar un horario que nos acomode.`]
     ];
   }else{
     chatSessions[key]=[
       ['them',`Hola, soy ${contactName}, ${contactRelation.toLowerCase()} de ${seniorName}. Estamos buscando apoyo según lo indicado en su perfil.`],
       ['me',`Hola ${contactName}, gracias por contactarme. Revisé las necesidades de ${seniorName} y me gustaría conversar sobre los horarios.`],
       ['them',`Perfecto. ¿Qué días y en qué horario tendrías disponibilidad?`]
     ];
   }
 }
 activeMatchedChatMessages=chatSessions[key];
 activeMatchedChatTitle=contactName;
 activeMatchedChatContext=isFamily?`Cuenta: ${accountHolderName()} · Apoyo para ${seniorName}`:`${contactRelation} de ${seniorName}`;
 renderChatConversation();
}
let activeMatchedChatTitle='';
let activeMatchedChatContext='';
let activeBooking = null;
let confirmedBookings = [];
let evaluationTarget = null;
let chosenRating = 0;
const demoHistory = [
 {senior:'Ignacio Cortés',caregiver:'Valeria Tapia',date:'2026-10-14',start:'09:00',end:'13:00',status:'Finalizado',rating:null},
 {senior:'Marta Silva',caregiver:'Paula Herrera',date:'2026-10-20',start:'10:00',end:'14:00',status:'Finalizado',rating:5}
];
function fmtDate(date){return new Date(date+'T12:00:00').toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'});}
function renderAgendaScreen(){
 const bookings=[...confirmedBookings.map((b,i)=>({...b,idx:i,source:'current'})),...demoHistory.map((b,i)=>({...b,idx:i,source:'history'}))];
 const cards=bookings.map(b=>{
  const done=b.status==='Finalizado'||b.status==='Calificado';
  const status=b.status==='Pendiente'?'ESPERANDO APROBACIÓN DE LA SOLICITUD':b.status.toUpperCase();
  const button=done?(b.rating?`<span class="badge badge-ok">Evaluación: ${b.rating}/5 ★</span>`:`<button class="btn btn-secondary" style="margin-top:10px;" onclick="openEvaluation('${b.source}',${b.idx})">Calificar servicio</button>`):b.status==='Aprobado'?`<button class="btn btn-secondary" style="margin-top:10px;" onclick="finishBooking(${b.idx})">Marcar como finalizado (simulación)</button>`:b.source==='current'?`<button class="btn btn-secondary" style="margin-top:10px;" onclick="approveBooking(${b.idx})">Simular aprobación</button>`:'';
  return `<div class="agenda-card"><div class="agenda-date">${escapeChatText(fmtDate(b.date))} · ${escapeChatText(b.start)}–${escapeChatText(b.end)}</div><div class="t-h2">${escapeChatText(b.senior)}</div><div class="t-sec">Cuidador/a: ${escapeChatText(b.caregiver)}</div>${b.notes?`<div class="t-sec">${escapeChatText(b.notes)}</div>`:''}<p style="font-weight:700;margin:10px 0;color:var(--accent)">${escapeChatText(status)}</p>${button}</div>`;
 }).join('');
 document.getElementById('phoneScreen').innerHTML=`<div class="statusbar"></div>${topAppBar('agenda')}<div class="screen-body"><div class="t-h1">Mi agenda</div><p class="t-sec" style="margin-bottom:12px;">Solicitudes y servicios de demostración</p>${cards}</div>${bottomNav('agenda')}`;
 document.getElementById('crumb').textContent='Pantalla actual: Mi agenda';
}
function approveBooking(i){if(confirmedBookings[i]){confirmedBookings[i].status='Aprobado';renderAgendaScreen();}}
function finishBooking(i){if(confirmedBookings[i]){confirmedBookings[i].status='Finalizado';renderAgendaScreen();}}
function openEvaluation(source,i){evaluationTarget={source,i};chosenRating=0;const b=source==='history'?demoHistory[i]:confirmedBookings[i];
 document.getElementById('phoneScreen').innerHTML=`<div class="statusbar"></div><div class="screen-body"><div class="screen-header"><div class="back-btn" onclick="renderAgendaScreen()">←</div><div class="t-h1">Calificar servicio</div></div><p class="t-sec">${escapeChatText(b.senior)} · ${escapeChatText(b.caregiver)}</p><p class="t-body">Selecciona de 1 a 5 estrellas.</p><div id="ratingStars" style="display:flex;justify-content:center;gap:6px;margin:20px 0;">${[1,2,3,4,5].map(n=>`<button id="rating-${n}" onclick="chooseRating(${n})" style="font-size:31px;color:#9ba8b3;border:0;background:none;padding:3px;">★</button>`).join('')}</div><div class="field"><label>Comentario (opcional)</label><textarea id="ratingComment" rows="3" placeholder="¿Cómo fue el servicio?"></textarea></div><button class="btn btn-accent" onclick="submitRating()">Enviar evaluación</button></div>`;
}
function chooseRating(n){chosenRating=n;for(let i=1;i<=5;i++){const el=document.getElementById('rating-'+i);if(el)el.style.color=i<=n?'#e8ad25':'#9ba8b3';}}
function submitRating(){if(!evaluationTarget||!chosenRating){alert('Selecciona una calificación.');return;}const b=evaluationTarget.source==='history'?demoHistory[evaluationTarget.i]:confirmedBookings[evaluationTarget.i];b.rating=chosenRating;b.review=document.getElementById('ratingComment').value.trim();b.status='Calificado';renderAgendaScreen();}

function getMatchedProfile(){
 const isFamily=currentRole==='family';
 return isFamily
   ? (matchingProfiles.family[selectedCaregiverIndex]||matchingProfiles.family[0])
   : (matchingProfiles.caregiver[selectedFamilyIndex]||matchingProfiles.caregiver[0]);
}
function getFamilyContact(profile){
 if(profile.contactName) return {name:profile.contactName,relation:profile.contactRelation||'Familiar'};
 const senior=profile.name||'Persona mayor';
 const parts=senior.trim().split(/\\s+/);
 const surname=parts.length>1?parts.slice(1).join(' '):'';
 return {name:(currentRole==='caregiver'?'Familiar de ':'')+(surname?'Familia '+surname:'Familiar responsable'),relation:'Familiar responsable'};
}
function startBooking(){
 const isFamily=currentRole==='family';
 const profile=getMatchedProfile();
 const senior=isFamily?(createdFamilyProfile.name||'Persona mayor'):(profile.name||'Persona mayor');
 const caregiver=isFamily?profile.name:(createdCaregiverProfile.name||'Cuidador/a');
 const contact=isFamily?null:getFamilyContact(profile);
 activeBooking={senior,caregiver,contact:contact?.name||'',profileIndex:isFamily?selectedCaregiverIndex:selectedFamilyIndex};
 renderBookingScreen();
}
function renderBookingScreen(){
 const b=activeBooking||{senior:'Persona mayor',caregiver:'Cuidador/a',contact:''};
 const phone=document.getElementById('phoneScreen');
 const now=new Date();const minDate=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
 phone.innerHTML=`<div class="statusbar"></div><div class="screen-body">
 <div class="screen-header"><div class="back-btn" onclick="renderChatConversation()">←</div><div class="t-h1">Coordinar / agendar turno</div></div>
 <p class="t-sec">Selecciona una fecha y horario específico para solicitar el servicio.</p>
 <div class="agenda-card" style="margin:14px 0;"><div class="t-h2">${escapeChatText(b.senior)}</div><div class="t-sec">Persona mayor</div><div class="t-h2" style="margin-top:8px;">${escapeChatText(b.caregiver)}</div><div class="t-sec">Cuidador/a</div>${b.contact?`<div class="t-sec" style="margin-top:6px;">Contacto familiar: ${escapeChatText(b.contact)}</div>`:''}</div>
 <div id="bookingForm">
 <div class="field"><label for="bookingDate">Día del servicio</label><input id="bookingDate" type="date" min="${minDate}" value="${minDate}"></div>
 <div class="field"><label for="bookingStart">Hora de inicio</label><input id="bookingStart" type="time" value="09:00"></div>
 <div class="field"><label for="bookingEnd">Hora de término</label><input id="bookingEnd" type="time" value="13:00"></div>
 <div class="field"><label for="bookingNotes">Detalles adicionales (opcional)</label><input id="bookingNotes" type="text" maxlength="180" placeholder="Ej.: acompañamiento y preparación de alimentos"></div>
 <button class="btn btn-accent" type="button" onclick="confirmBooking()">Enviar solicitud de turno</button>
 </div>
 <div id="bookingFeedback" style="margin-top:12px;"></div>
 </div>`;
 document.getElementById('crumb').textContent='Pantalla actual: Agendamiento';
}
function confirmBooking(){
 const dateEl=document.getElementById('bookingDate');
 const startEl=document.getElementById('bookingStart');
 const endEl=document.getElementById('bookingEnd');
 const noteEl=document.getElementById('bookingNotes');
 const feedback=document.getElementById('bookingFeedback');
 if(!dateEl||!startEl||!endEl||!activeBooking){
   if(feedback)feedback.textContent='No se pudo recuperar el formulario. Vuelve al chat e inténtalo de nuevo.';
   return;
 }
 const date=dateEl.value,start=startEl.value,end=endEl.value,notes=noteEl?.value.trim()||'';
 if(!date||!start||!end){
   if(feedback)feedback.textContent='Selecciona el día, la hora de inicio y la hora de término.';
   return;
 }
 if(end<=start){
   if(feedback)feedback.textContent='La hora de término debe ser posterior a la hora de inicio.';
   return;
 }
 confirmedBookings.unshift({...activeBooking,date,start,end,notes,status:'Pendiente'});
 renderAgendaScreen();
}


function renderChatConversation(){
 let c;
 if(activeChatMode==='matched'){
   c={name:activeMatchedChatTitle,context:activeMatchedChatContext,messages:activeMatchedChatMessages};
 }else{
   c=chatDisplayData()[activeChatIndex]||chatDisplayData()[0];
 }
 const bubbles=c.messages.map(([who,msg])=>`<div class="bubble ${who==='me'?'bubble-me':'bubble-them'}">${escapeChatText(msg)}</div>`).join('');
 const phone=document.getElementById('phoneScreen');
 phone.innerHTML=`<div class="statusbar"></div><div class="screen-header" style="padding:12px 18px 0;"><div class="back-btn" onclick="${activeChatMode==='matched'?(currentRole==='family'?"renderCaregiverProfile()":"renderFamilyProfile()") : "goto('chat-list')"}">←</div><div style="min-width:0;"><div class="t-h2">${escapeChatText(c.name)}</div><div class="t-sec" style="font-size:11px;">${escapeChatText(accountHolderName())} · ${escapeChatText(c.context)}</div></div></div><div class="screen-body" id="chatMessageArea" style="display:flex;flex-direction:column;">${bubbles}<div style="margin-top:20px;"><button class="btn btn-accent" onclick="startBooking()">Coordinar / agendar turno</button></div></div><form class="chat-composer" onsubmit="sendChatMessage(event)"><input id="chatMessageInput" type="text" maxlength="500" placeholder="Escribe un mensaje..." autocomplete="off" aria-label="Escribe un mensaje"><button type="submit" aria-label="Enviar mensaje">Enviar</button></form>`;
 const area=document.getElementById('chatMessageArea');
 area.scrollTop=area.scrollHeight;
 document.getElementById('crumb').textContent='Pantalla actual: Conversación · '+c.name;
 document.querySelectorAll('.rail-item').forEach(b=>b.classList.toggle('current',b.dataset.id==='chat-conversation'));
}
function sendChatMessage(event){
 event.preventDefault();
 const input=document.getElementById('chatMessageInput');
 const message=input?.value.trim();
 if(!message)return;
 if(activeChatMode==='matched'){
   activeMatchedChatMessages.push(['me',message]);
 }else{
   getChatMessages(activeChatIndex).push(['me',message]);
 }
 renderChatConversation();
 const area=document.getElementById('chatMessageArea');if(area)area.scrollTop=area.scrollHeight;
 const nextInput=document.getElementById('chatMessageInput');
 if(nextInput){nextInput.value='';nextInput.focus();}
}
function renderMatchingFeed(){
 const family=currentRole==='family', profiles=matchingProfiles[currentRole], phone=document.getElementById('phoneScreen');
 document.getElementById('crumb').textContent='Pantalla actual: '+(family?'Matching · Cuidadores disponibles':'Matching · Personas mayores');
 if(matchingIndex>=profiles.length){phone.innerHTML=`<div class="statusbar"></div>${topAppBar('matching-feed')}<div class="screen-body"><div class="matching-empty"><div class="empty-emoji">🔎</div><div class="t-h2">Has revisado todos los perfiles</div><p class="t-sec">Puedes volver a revisar los perfiles de esta selección.</p><button class="btn btn-primary" style="margin-top:18px" onclick="restartMatching()">Volver a revisar</button></div></div>`;return;}
 const p=profiles[matchingIndex], tags=p.tags.map(t=>`<span class="matching-label">${t}</span>`).join('');
 phone.innerHTML=`<div class="statusbar"></div>${topAppBar('matching-feed')}<div class="screen-body" style="padding-top:12px"><div class="matching-intro"><div class="t-h1">${family?'Personas cuidadoras disponibles':'Personas mayores que buscan apoyo'}</div><p class="t-sec">${family?'Explora perfiles de cuidadores y cuidadoras para encontrar apoyo para tu familiar.':'Explora solicitudes de familias que buscan apoyo para una persona mayor.'}</p></div><div class="matching-counter"><span>Perfil ${matchingIndex+1} de ${profiles.length}</span><span>${p.distance}</span></div><div class="matching-progress"><span style="width:${(matchingIndex+1)/profiles.length*100}%"></span></div><div class="matching-card" id="activeMatchingCard" ontouchstart="startSwipe(event)" ontouchend="endSwipe(event)" onmousedown="startSwipe(event)" onmouseup="endSwipe(event)"><div class="matching-visual"><div class="matching-initials">${p.initials}</div></div><div class="matching-details"><div class="t-h2">${p.name}</div><div class="matching-meta">${p.subtitle}</div><div class="matching-meta">${p.rate}</div><div style="margin:10px 0 7px">${tags}</div><p class="t-body" style="font-size:13px;color:var(--text-secondary);margin:8px 0 0">${p.about}</p></div></div><div class="matching-actions"><button class="round-btn reject" aria-label="Descartar perfil" onclick="swipeProfile('left')">✕</button><button class="round-btn accept" aria-label="Mostrar interés" onclick="swipeProfile('right')">♥</button></div><p class="matching-hint">Desliza a la izquierda para descartar o a la derecha para mostrar interés.</p></div>`;
 document.querySelectorAll('.rail-item').forEach(b=>b.classList.toggle('current',b.dataset.id==='matching-feed'));
}
function startSwipe(e){swipeStartX=e.type==='touchstart'?e.touches[0].clientX:e.clientX;}
function endSwipe(e){if(swipeStartX===null)return;const x=e.type==='touchend'?e.changedTouches[0].clientX:e.clientX,delta=x-swipeStartX;swipeStartX=null;if(Math.abs(delta)>55)swipeProfile(delta>0?'right':'left');}
function swipeProfile(direction){
 const card=document.getElementById('activeMatchingCard');
 if(!card)return;
 // Guardar el índice exacto del perfil que recibió el interés.
 // Así la pantalla de detalle abre a la persona seleccionada y no siempre el primer registro.
 if(direction==='right'){
   if(currentRole==='family') selectedCaregiverIndex=matchingIndex;
   else selectedFamilyIndex=matchingIndex;
 }
 card.classList.add(direction==='right'?'swipe-right':'swipe-left');
 setTimeout(()=>{
   if(direction==='right'){goto('match-success');}
   else{matchingIndex++;renderMatchingFeed();}
 },160);
}
function restartMatching(){matchingIndex=0;renderMatchingFeed();}

function renderFamilyProfile(){
  const p = currentRole === 'family'
    ? createdFamilyProfile
    : (matchingProfiles.caregiver[selectedFamilyIndex] || matchingProfiles.caregiver[0]);
  const name = p.name || 'Persona mayor';
  const location = p.location || p.subtitle || 'Ubicación no especificada';
  const needs = p.needs || p.about || 'Acompañamiento y apoyo en actividades cotidianas.';
  const schedule = p.schedule || p.rate || 'Por coordinar con la familia';
  const tags = (p.tags || []).map(t=>`<span class="matching-label">${t}</span>`).join('');
  const content = `<div class="screen-header"><div class="back-btn" onclick="goto('matching-feed')">←</div><div class="t-h1">Perfil de persona mayor</div></div>
    <div style="display:flex;justify-content:center;margin:12px 0;"><div class="avatar-sm" style="width:76px;height:76px;font-size:24px;">${name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}</div></div>
    <div style="text-align:center;"><div class="t-h2">${name}</div><div class="t-sec">${location}${p.subtitle && p.location ? ' · '+p.subtitle.split('·')[0].trim() : ''}</div></div>
    <div style="margin:16px 0;"><span class="badge badge-health">Perfil de demostración</span></div>
    <div class="field"><label>Necesidades de apoyo</label><div class="t-body">${needs}</div></div>
    <div class="field"><label>Horario / modalidad</label><div class="t-body">${schedule}</div></div>
    <div style="margin:8px 0 16px;">${tags}</div>
    <button class="btn btn-accent" onclick="openMatchedChat()">Contactar familia</button>`;
  document.getElementById('phoneScreen').innerHTML = `<div class="statusbar"></div><div class="screen-body">${content}</div>`;
  document.getElementById('crumb').textContent = 'Pantalla actual: Perfil · ' + name;
}

function openMenu(returnTo){
  const overlay = `
    <div class="menu-overlay" onclick="if(event.target===this) closeMenu()">
      <div class="menu-sheet">
        <div class="menu-item">👤 Mi cuenta</div>
        <div class="menu-item">🔒 Privacidad</div>
        <div class="menu-item">🛟 Soporte</div>
        <div class="menu-item">❓ Preguntas frecuentes</div>
        <div class="menu-item">♿ Accesibilidad</div>
        <div class="menu-item" onclick="closeMenu();goto('role-select')">🚪 Cerrar sesión</div>
      </div>
    </div>`;
  document.getElementById('phoneScreen').insertAdjacentHTML('beforeend', overlay);
}
function closeMenu(){
  const el = document.querySelector('.menu-overlay');
  if(el) el.remove();
}

let matchingSearchTimer = null;
function showMatchingSearch(){
  if(matchingSearchTimer!==null)clearTimeout(matchingSearchTimer);
  const phone=document.getElementById('phoneScreen');
  phone.innerHTML=`<div class="statusbar"></div><div class="screen-body"><div class="match-search-wait" role="status" aria-live="polite"><div class="match-search-icon" aria-hidden="true">🌎<span class="match-search-lens">🔍</span></div><div class="t-h1">Buscando perfiles cercanos a ti...</div><p class="t-sec">Explorando perfiles disponibles en tu zona</p><div class="match-search-dots" aria-hidden="true"><span></span><span></span><span></span></div></div></div>`;
  document.getElementById('crumb').textContent='Pantalla actual: Buscando perfiles cercanos';
  matchingSearchTimer=setTimeout(()=>{matchingSearchTimer=null;goto('matching-feed');},2000);
}

function goto(id){
  if(matchingSearchTimer!==null){clearTimeout(matchingSearchTimer);matchingSearchTimer=null;}
  if(id==='chat-list'){renderChatList();return;}
  if(id==='chat-conversation'){activeChatMode='list';renderChatConversation();return;}
  if(id==='agenda'){renderAgendaScreen();return;}
  if(id==='upload-docs'){renderIdentityScreen();return;}
  if(id==='evaluation'){openEvaluation('history',0);return;}
  if(id==='matching-feed'){renderMatchingFeed();window.scrollTo({top:0,behavior:'smooth'});return;}
  const s = screens[id];
  const el = document.getElementById('phoneScreen');
  const wrapped = s.nav
    ? `<div class="statusbar"></div>${s.body}`
    : `<div class="statusbar"></div><div class="screen-body">${s.body}</div>`;
  el.innerHTML = wrapped;
  document.getElementById('crumb').textContent = 'Pantalla actual: ' + s.crumb;
  document.querySelectorAll('.rail-item').forEach(b=>b.classList.toggle('current', b.dataset.id===id));
  window.scrollTo({top:0,behavior:'smooth'});
}

const groups = {
  1:['role-select','register-family','register-caregiver','upload-docs','login','mfa'],
  2:['matching-feed','match-success','matching-empty'],
  3:['profile-caregiver','profile-family'],
  4:['chat-list','chat-conversation','agenda','training','evaluation']
};
const labels = {
  'role-select':'Selección de perfil','register-family':'Registro Familia','register-caregiver':'Registro Cuidador',
  'upload-docs':'Carga documentos','login':'Login','mfa':'Verificación MFA',
  'matching-feed':'Feed matching','match-success':'¡Es un match!','matching-empty':'Estado vacío',
  'profile-caregiver':'Perfil cuidador','profile-family':'Perfil familia',
  'chat-list':'Lista de chats','chat-conversation':'Conversación','agenda':'Agenda','training':'Capacitación','evaluation':'Evaluación'
};
for(const g in groups){
  const rail = document.getElementById('rail-'+g);
  groups[g].forEach(id=>{
    const b = document.createElement('button');
    b.className='rail-item';
    b.dataset.id=id;
    b.textContent=labels[id];
    b.onclick=()=>goto(id);
    rail.appendChild(b);
  });
}

goto('role-select');
